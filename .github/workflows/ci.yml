name: CI

on:
  pull_request:
    branches:
      - dev
  push:
    branches:
      - dev

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend
    runs-on: ubuntu-latest
    timeout-minutes: 20

    services:
      sqlserver:
        image: mcr.microsoft.com/mssql/server:2022-latest
        env:
          ACCEPT_EULA: "Y"
          MSSQL_PID: Express
          MSSQL_SA_PASSWORD: KnowledgeAssistant_CI_2026!
        ports:
          - 1433:1433
        options: >-
          --health-cmd "/opt/mssql-tools18/bin/sqlcmd -S localhost -U sa
          -P 'KnowledgeAssistant_CI_2026!' -C -Q 'SELECT 1'"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 12
          --health-start-period 20s

    env:
      KNOWLEDGE_ASSISTANT_TEST_CONNECTION: >-
        Server=localhost,1433;Database=KnowledgeAssistantValidation;
        User Id=sa;Password=KnowledgeAssistant_CI_2026!;
        Encrypt=False;TrustServerCertificate=True

    steps:
      - name: Obtener código
        uses: actions/checkout@v4

      - name: Configurar .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 9.0.305

      - name: Restaurar dependencias
        run: dotnet restore KnowledgeAssistant.sln

      - name: Compilar
        run: dotnet build KnowledgeAssistant.sln --configuration Release --no-restore

      - name: Ejecutar pruebas con cobertura
        run: >-
          dotnet test KnowledgeAssistant.sln
          --configuration Release
          --no-build
          --collect:"XPlat Code Coverage"
          --results-directory artifacts/test-results

      - name: Publicar resultados backend
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: backend-test-results
          path: artifacts/test-results
          if-no-files-found: error
          retention-days: 14

  frontend:
    name: Frontend
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Obtener código
        uses: actions/checkout@v4

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Instalar dependencias
        working-directory: frontend
        run: npm ci --workspaces=false

      - name: Compilar
        working-directory: frontend
        run: ./node_modules/.bin/ng build

      - name: Ejecutar pruebas con cobertura
        working-directory: frontend
        run: |
          export PATH="$PWD/node_modules/.bin:$PATH"
          node scripts/resolve-browser.mjs \
            --watch=false \
            --browsers=ChromeHeadless \
            --code-coverage

      - name: Publicar cobertura frontend
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: frontend-coverage
          path: frontend/coverage
          if-no-files-found: error
          retention-days: 14
