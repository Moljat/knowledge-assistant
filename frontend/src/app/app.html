<mat-sidenav-container>
  <mat-sidenav #sidenav mode="over" class="app-sidenav" fixedInViewport>
    <mat-nav-list>
      <a mat-list-item routerLink="/" (click)="sidenav.close()">
        <mat-icon>dashboard</mat-icon>
        Dashboard
      </a>
      <a mat-list-item routerLink="/records" (click)="sidenav.close()">
        <mat-icon>description</mat-icon>
        Registros
      </a>
    </mat-nav-list>
  </mat-sidenav>

  <mat-toolbar class="app-toolbar">
    <button mat-icon-button (click)="sidenav.toggle()" class="menu-btn">
      <mat-icon>menu</mat-icon>
    </button>
    <a class="brand" routerLink="/">Knowledge Assistant</a>
    <span class="toolbar-spacer"></span>
    <nav class="nav-links">
      <a mat-button routerLink="/" routerLinkActive="active" [routerLinkActiveOptions]="{ exact: true }">
        Dashboard
      </a>
      <a mat-button routerLink="/records" routerLinkActive="active">Registros</a>
    </nav>
  </mat-toolbar>

  <main class="app-content">
    <router-outlet />
  </main>
</mat-sidenav-container>
